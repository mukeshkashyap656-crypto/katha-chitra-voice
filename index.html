<!doctype html>
<html lang="hi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4a0f14">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Katha Chitra Voice</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#2a0a0d;color:#f6e7c1;font-family:system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px;gap:14px}
h1{font-size:20px;margin:4px 0;color:#f2c14e}
#mic{width:150px;height:150px;border-radius:50%;border:4px solid #f2c14e;background:#7a1a20;color:#f2c14e;font-size:60px;cursor:pointer;box-shadow:0 0 0 0 rgba(242,193,78,.5)}
#mic.on{background:#c0392b;animation:p 1.1s infinite}
@keyframes p{70%{box-shadow:0 0 0 28px rgba(242,193,78,0)}100%{box-shadow:0 0 0 0 rgba(242,193,78,0)}}
textarea{width:100%;max-width:520px;min-height:120px;border-radius:12px;border:2px solid #7a1a20;background:#1b0608;color:#f6e7c1;font-size:17px;padding:12px}
button.b{width:100%;max-width:520px;padding:14px;border-radius:12px;border:0;background:#f2c14e;color:#3a0a0e;font-size:18px;font-weight:700}
button.b:disabled{opacity:.5}
#st{font-size:14px;color:#e8b7a0;min-height:20px;text-align:center}
#rep{width:100%;max-width:520px;background:#1b0608;border-radius:12px;padding:12px;white-space:pre-wrap;font-size:15px;line-height:1.5;display:none}
a{color:#f2c14e}
#set{width:100%;max-width:520px;font-size:13px;color:#cfa}
#set input{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #7a1a20;background:#1b0608;color:#f6e7c1}
small{opacity:.75}
#tabs{display:flex;gap:6px;width:100%;max-width:520px}
#tabs button{flex:1;padding:10px 2px;border-radius:10px;border:2px solid #7a1a20;background:#1b0608;color:#f6e7c1;font-size:12.5px;font-weight:700}
#tabs button.on{background:#f2c14e;color:#3a0a0e;border-color:#f2c14e}
.pane{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:14px}
.ctl textarea{width:100%;min-height:80px;margin-top:8px;border-radius:10px;border:1px solid #7a1a20;background:#120405;color:#f6e7c1;font-size:16px;padding:10px}.ctl{margin-top:10px;padding-top:8px;border-top:1px dashed #5a1219}.ctl input{width:100%;padding:10px;border-radius:8px;border:1px solid #7a1a20;background:#120405;color:#f6e7c1;font-size:16px}.row{display:flex;gap:8px}.row button{flex:1;margin-left:0!important;margin-top:8px}.sec{width:100%;max-width:520px;font-size:17px;font-weight:700;color:#f2c14e;border-top:2px solid #5a1219;padding-top:14px;margin-top:6px}
.card{width:100%;background:#1b0608;border:1px solid #5a1219;border-radius:12px;padding:12px;font-size:14px;line-height:1.5}
.card h3{margin:0 0 6px;font-size:15px;color:#f2c14e}
.card .m{font-size:12px;opacity:.7;margin-bottom:6px}
.card .t{white-space:pre-wrap;word-break:break-word}
.card video,.card img{width:100%;border-radius:10px;background:#000;margin-top:8px}
.card button{margin-top:8px;padding:10px 14px;border-radius:10px;border:0;background:#f2c14e;color:#3a0a0e;font-weight:700;font-size:15px}
.card button+button{margin-left:8px;background:#7a1a20;color:#f2c14e}
</style></head><body>
<h1>🎙️ Katha Chitra · Bol kar kaam karao</h1>
<div class="pane" id="p1">
<button id="mic" aria-label="mic">🎤</button>
<div id="st">Mic dabao aur bolo</div>
<textarea id="txt" placeholder="Jo bologe yahan likha aayega. Galti ho to yahin theek kar lo."></textarea>
<button class="b" id="send">Bhejo (AI ko kaam do)</button>
<div id="rep"></div>
</div>
<div class="sec">📜 AI ke kaam aur jawab</div>
<div class="pane" id="p2"><button class="b" id="r2">🔄 Naya dekho</button><div id="l2" style="width:100%;display:flex;flex-direction:column;gap:10px"></div></div>
<div class="sec">🎬 Bane hue video</div>
<div class="pane" id="p3"><button class="b" id="r3">🔄 Naye video dekho</button><div id="l3" style="width:100%;display:flex;flex-direction:column;gap:10px"></div></div>
<div class="sec">📺 YouTube par roz ka system</div>
<div class="pane" id="p4"><button class="b" id="r4">🔄 Naya dekho</button><div id="l4" style="width:100%;display:flex;flex-direction:column;gap:10px"></div></div>
<details id="set"><summary>⚙️ Pehli baar setup (token)</summary>
<small>GitHub token ek baar yahan daalo. Ye sirf is phone mein save rehta hai.</small>
<input id="tok" type="password" placeholder="GitHub token (github_pat_...)">
<button class="b" id="save" style="padding:10px;font-size:15px">Save karo</button>
</details>
<script>
const OWNER="mukeshkashyap656-crypto",REPO="katha-chitra-videos";
const $=id=>document.getElementById(id);
const st=t=>$("st").textContent=t;
const gt=()=>{try{return localStorage.getItem("kc_tok")||""}catch(e){return ""}};
if(!gt())$("set").open=true;
$("save").onclick=()=>{try{localStorage.setItem("kc_tok",$("tok").value.trim());$("tok").value="";$("set").open=false;st("Token save ho gaya ✅");setTimeout(loadAll,200)}catch(e){st("Save nahi hua")}};

// ---- voice ----
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,on=false,base="";
if(!SR){st("Is browser mein mic nahi chalta. Chrome use karo, ya keyboard ka mic dabao.")}
$("mic").onclick=()=>{
  if(!SR){$("txt").focus();return}
  if(on){rec.stop();return}
  rec=new SR();rec.lang="hi-IN";rec.interimResults=true;rec.continuous=true;
  base=$("txt").value?($("txt").value.trim()+" "):"";
  rec.onresult=e=>{let s="";for(let i=0;i<e.results.length;i++)s+=e.results[i][0].transcript;$("txt").value=base+s};
  rec.onstart=()=>{on=true;$("mic").classList.add("on");st("Sun raha hoon… bolo. Rokne ko phir dabao")};
  rec.onend=()=>{on=false;$("mic").classList.remove("on");st("Ruk gaya. Theek ho to Bhejo dabao")};
  rec.onerror=e=>{st(e.error==="not-allowed"?"Mic ki ijazat do (Chrome settings → Site settings → Microphone)":"Mic error: "+e.error)};
  rec.start();
};

// ---- send to GitHub AI ----
const api=(p,o={})=>fetch("https://api.github.com/repos/"+OWNER+"/"+REPO+p,{cache:"no-store",...o,headers:{"Authorization":"Bearer "+gt(),"Accept":"application/vnd.github+json","Content-Type":"application/json"}});
let polling=null;
$("send").onclick=async()=>{
  let t=$("txt").value.trim();
  if(!t){st("Pehle kuch bolo ya likho");return}
  if(!gt()){$("set").open=true;st("Pehle token daalo");return}
  if(!/@ai/i.test(t))t="@ai "+t;
  $("send").disabled=true;st("Bhej raha hoon…");
  try{
    const r=await api("/issues",{method:"POST",body:JSON.stringify({title:"Voice: "+t.replace("@ai","").trim().slice(0,50),body:t})});
    const j=await r.json();
    if(!r.ok)throw new Error(j.message||r.status);
    $("txt").value="";
    st("Bhej diya ✅ AI kaam kar raha hai (issue #"+j.number+")");
    $("rep").style.display="block";$("rep").innerHTML='Jawab aate hi yahin dikhega…<br><a href="'+j.html_url+'" target="_blank">GitHub par dekho</a>';
    try{localStorage.setItem("kc_last",JSON.stringify([j.number,j.html_url]))}catch(e){}
    wait(j.number,j.html_url);setTimeout(loadWork,3000);
  }catch(e){st("Nahi gaya: "+e.message+" (token sahi hai? issues likhne ki ijazat?)")}
  $("send").disabled=false;
};
function wait(n,url){
  clearInterval(polling);let tries=0;
  const chk=async()=>{
    tries++;if(tries>360){clearInterval(polling);return}
    try{
      const r=await api("/issues/"+n+"/comments");const c=await r.json();
      if(Array.isArray(c)&&c.length){
        const x=c[c.length-1].body.replace(/<sub>.*?<\/sub>/gs,"").trim();
        $("rep").innerHTML="";const d=document.createElement("div");d.textContent=x;$("rep").appendChild(d);
        const a=document.createElement("a");a.href=url;a.target="_blank";a.textContent="\nPoora GitHub par dekho";$("rep").appendChild(a);
        st("AI ka jawab aa gaya");
        if(/video|render|taiyar|link/i.test(x)===false)clearInterval(polling);
      }
    }catch(e){}
  };
  chk();polling=setInterval(chk,5000);
}
try{const l=JSON.parse(localStorage.getItem("kc_last")||"null");if(l&&gt()){$("rep").style.display="block";$("rep").textContent="Pichla jawab dekh raha hoon…";wait(l[0],l[1])}}catch(e){}
document.addEventListener("visibilitychange",()=>{if(!document.hidden){try{const l=JSON.parse(localStorage.getItem("kc_last")||"null");if(l&&gt())wait(l[0],l[1])}catch(e){}}});

const esc=t=>t.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const clean=t=>t.replace(/<sub>[\s\S]*?<\/sub>/g,"").trim();
const fd=d=>new Date(d).toLocaleString("hi-IN",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});

function fixBox(issue,bhag){
  const w=document.createElement("div");w.className="ctl";
  w.innerHTML="<button class=fx>✏️ Sudhar karwao</button><div class=fb style='display:none'><textarea class=ft placeholder='Kya theek karwana hai? Bolo ya likho. Jaise: Ram ka chehra bada karo, awaaz dheemi karo'></textarea><div class=row><button class=fm>🎤 Bolo</button><button class=fs>Bhejo</button></div><div class=m></div></div>";
  const fb=w.querySelector(".fb"),ta=w.querySelector(".ft"),m=w.querySelector(".m");
  w.querySelector(".fx").onclick=e=>{fb.style.display=fb.style.display==="none"?"block":"none"};
  let rec=null,on=false;const fm=w.querySelector(".fm");
  fm.onclick=()=>{
    const SRX=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SRX){ta.focus();m.textContent="Is browser mein mic nahi, keyboard ka mic dabao";return}
    if(on){rec.stop();return}
    const base=ta.value?ta.value.trim()+" ":"";
    rec=new SRX();rec.lang="hi-IN";rec.interimResults=true;rec.continuous=true;
    rec.onresult=ev=>{let t="";for(let i=0;i<ev.results.length;i++)t+=ev.results[i][0].transcript;ta.value=base+t};
    rec.onstart=()=>{on=true;fm.textContent="⏹ Roko";fm.style.background="#c0392b"};
    rec.onend=()=>{on=false;fm.textContent="🎤 Bolo";fm.style.background=""};
    rec.onerror=ev=>{m.textContent="Mic error: "+ev.error};
    rec.start();
  };
  w.querySelector(".fs").onclick=async ev=>{
    const t=ta.value.trim();if(!t){m.textContent="Pehle bolo ya likho";return}
    if(!gt()){m.textContent="Pehle token daalo";return}
    ev.target.disabled=true;m.textContent="Bhej raha hoon…";
    try{
      let r;const body="@ai "+(bhag?"Bhag "+bhag+" mein sudhar: ":"Sudhar: ")+t;
      if(issue)r=await api("/issues/"+issue+"/comments",{method:"POST",body:JSON.stringify({body:"@ai Sudhar: "+t})});
      else r=await api("/issues",{method:"POST",body:JSON.stringify({title:"Bhag "+bhag+" sudhar",body:body})});
      const j=await r.json();if(!r.ok)throw new Error(j.message||r.status);
      ta.value="";m.textContent="✅ AI ko bhej diya"+(issue?"":" (issue #"+j.number+")")+". Jawab 'AI ke kaam' mein dikhega.";
      setTimeout(loadWork,4000);
    }catch(er){m.textContent="❌ "+er.message}
    ev.target.disabled=false;
  };
  return w;
}
async function loadWork(){
  const L=$("l2");if(!gt()){L.textContent="Pehle token daalo";return}
  L.textContent="Dekh raha hoon…";
  try{
    const r=await api("/issues?state=all&per_page=15&sort=updated");const j=await r.json();
    if(!r.ok)throw new Error(j.message);
    L.innerHTML="";
    for(const i of j){
      if(i.pull_request)continue;
      const c=document.createElement("div");c.className="card";
      c.innerHTML="<h3>#"+i.number+" · "+esc(i.title)+"</h3><div class=m>"+fd(i.updated_at)+" · "+(i.state==="open"?"chal raha":"poora")+" · "+i.comments+" jawab</div><button>Jawab dekho</button>";
      c.appendChild(fixBox(i.number));
      c.querySelector("button").onclick=async e=>{
        e.target.disabled=true;e.target.textContent="…";
        const cr=await api("/issues/"+i.number+"/comments?per_page=30");const cs=await cr.json();
        const d=document.createElement("div");d.className="t";
        d.textContent=Array.isArray(cs)&&cs.length?cs.map(x=>clean(x.body)).join("\n\n— — —\n\n"):"Abhi koi jawab nahi";
        e.target.replaceWith(d);
      };
      L.appendChild(c);
    }
    if(!L.children.length)L.textContent="Abhi kuch nahi";
  }catch(e){L.textContent="Nahi aaya: "+e.message}
}
async function fileBlob(branch,name){
  const r=await fetch("https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/"+name.split("/").map(encodeURIComponent).join("/")+"?ref="+encodeURIComponent(branch),{cache:"no-store",headers:{"Authorization":"Bearer "+gt(),"Accept":"application/vnd.github.raw"}});
  if(!r.ok)throw new Error(r.status===404?"file nahi mili (shayad hat gayi)":(r.status===403||r.status===401?"token ko Contents: Read-only ki ijazat chahiye":"error "+r.status));
  return URL.createObjectURL(await r.blob());
}
async function loadVideos(){
  const L=$("l3");if(!gt()){L.textContent="Pehle token daalo";return}
  L.textContent="Video dhoondh raha hoon…";
  try{
    const r=await api("/issues/comments?per_page=100&sort=created&direction=desc");const j=await r.json();
    if(!r.ok)throw new Error(j.message);
    const seen={},vids=[];
    for(const c of j){
      const re=/blob\/(render-[^\/\s)]+)\/([^\s)\]]+\.mp4)/g;let m;
      while((m=re.exec(c.body))){
        const k=m[1]+"/"+m[2];if(seen[k])continue;seen[k]=1;
        const cov=(c.body.match(new RegExp("blob\\/"+m[1].replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\/([^\\s)\\]]+\\.jpg)","g"))||[]).map(x=>x.split("/").pop()).filter(x=>x!=="check_sheet.jpg")[0];
        vids.push({b:m[1],f:m[2],cover:cov,at:c.created_at,n:c.issue_url.split("/").pop()});
      }
    }
    L.innerHTML="";
    if(!vids.length){L.textContent="Abhi koi video nahi bana";return}
    for(const v of vids.slice(0,15)){
      const c=document.createElement("div");c.className="card";
      c.innerHTML="<h3>🎬 "+esc(v.f.replace(/\.mp4$/,"").replace(/_/g," "))+"</h3><div class=m>Issue #"+v.n+" · "+fd(v.at)+"</div><button class=pl>▶ Chalao</button>";
      c.appendChild(fixBox(v.n));
      c.querySelector(".pl").onclick=async e=>{
        const b=e.target;b.disabled=true;b.textContent="Aa raha hai…";
        try{
          const u=await fileBlob(v.b,v.f);
          const vd=document.createElement("video");vd.src=u;vd.controls=true;vd.playsInline=true;
          const a=document.createElement("button");a.textContent="⤓ Download";a.onclick=()=>{const x=document.createElement("a");x.href=u;x.download=v.f;x.click()};
          b.replaceWith(vd);vd.after(a);
          if(v.cover){try{const cu=await fileBlob(v.b,v.cover);const im=document.createElement("img");im.src=cu;a.after(im)}catch(e){}}
        }catch(err){b.disabled=false;b.textContent="▶ Phir koshish";const w=document.createElement("div");w.className="m";w.textContent=err.message;b.after(w)}
      };
      L.appendChild(c);
    }
  }catch(e){L.textContent="Nahi aaya: "+e.message}
}
$("r2").onclick=loadWork;$("r3").onclick=loadVideos;

async function rawText(path,ref){
  const r=await fetch("https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/"+path.split("/").map(encodeURIComponent).join("/")+"?ref="+ref,{cache:"no-store",headers:{"Authorization":"Bearer "+gt(),"Accept":"application/vnd.github.raw"}});
  if(!r.ok)throw new Error(r.status===404?path+" nahi mili":(r.status===401||r.status===403?"token ko Contents: Read-only ki ijazat chahiye":"error "+r.status));
  return r.text();
}

async function saveEps(k,fn){
  const g=await fetch("https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/episodes.json?ref=main",{cache:"no-store",headers:{"Authorization":"Bearer "+gt(),"Accept":"application/vnd.github+json"}});
  const gj=await g.json();
  if(!g.ok)throw new Error(g.status===404?"episodes.json nahi mili":(g.status===401||g.status===403?"token ko Contents: Read and write chahiye":"error "+g.status));
  const bin=atob(gj.content.replace(/\n/g,""));const txt=new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)));
  const d=JSON.parse(txt);if(!d[k])throw new Error("Bhag "+k+" list mein nahi");
  fn(d[k]);
  const out=JSON.stringify(d,null,1)+"\n";
  const b64=btoa(Array.from(new TextEncoder().encode(out),c=>String.fromCharCode(c)).join(""));
  const pr=await fetch("https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/episodes.json",{method:"PUT",headers:{"Authorization":"Bearer "+gt(),"Accept":"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify({message:"Bhag "+k+": page se badlav",content:b64,sha:gj.sha,branch:"main"})});
  if(!pr.ok){const j=await pr.json().catch(()=>({}));throw new Error(pr.status===403||pr.status===404?"token ko Contents: Read and write chahiye":(j.message||"error "+pr.status))}
}
async function loadYT(){
  const L=$("l4");if(!gt()){L.textContent="Pehle token daalo";return}
  L.textContent="Dekh raha hoon…";
  try{
    L.innerHTML="";
    // pipeline
    const pc=document.createElement("div");pc.className="card";
    pc.innerHTML="<h3>⚙️ Roz ka system</h3><div class=t>Subah 6:30 → AI agla bhaag banata hai\nJaanch PASS → video taiyar (staged)\nShaam 7:00 → YouTube Short + Instagram Reel apne aap</div><div class=m id=runs style='margin-top:8px'>Chalne ka haal dekh raha hoon…</div>";
    L.appendChild(pc);
    // episodes
    let eps={};
    try{eps=JSON.parse(await rawText("episodes.json","main"))}catch(e){const w=document.createElement("div");w.className="card";w.textContent="Bhaagon ki list nahi aayi: "+e.message;L.appendChild(w)}
    const ks=Object.keys(eps).sort((a,b)=>b-a);
    for(const k of ks){
      const e=eps[k];const c=document.createElement("div");c.className="card";
      const posted=e.status==="posted"||e.youtube_id;
      const stt=posted?"✅ YouTube par ho gaya":(e.status==="ready"?"⏳ Taiyar · "+(e.date||"")+" shaam 7 baje jaayega":(e.auto?"🛠️ Ban raha hai":"📁 Purana (haath se)"));
      let h="<h3>Bhag "+k+" · "+esc((e.title||e.file||"").replace(/ #shorts$/,"").slice(0,70))+"</h3><div class=m>"+stt+(e.instagram_id?" · Instagram ✅":"")+"</div>";
      if(e.youtube_id)h+='<a href="https://www.youtube.com/shorts/'+e.youtube_id+'" target="_blank">▶ YouTube par dekho</a><br>';
      h+="<button class=pl>▶ Video chalao</button><button class=cp>Caption</button>";
      const canEdit=!posted&&e.auto!==undefined;
      if(canEdit){h+="<div class=ctl><div class=m>"+(e.auto===false?"⏸ ROKA HUA — post nahi hoga":"Post ki tarikh")+"</div><input type=date class=dt value='"+(e.date||"")+"'><div class=row><button class=sd>📅 Tarikh badlo</button><button class=ps>"+(e.auto===false?"▶ Chalu karo":"⏸ Rok do")+"</button></div><div class=row><button class=pn>🚀 Abhi post karo</button><button class=rb>🔁 Dobara banao</button></div><div class=m id=msg"+k+"></div></div>"}
      c.innerHTML=h;
      c.querySelector(".pl").onclick=async ev=>{
        const b=ev.target;b.disabled=true;b.textContent="Aa raha hai…";
        try{const u=await fileBlob("main",e.file);const vd=document.createElement("video");vd.src=u;vd.controls=true;vd.playsInline=true;b.replaceWith(vd)}
        catch(err){b.disabled=false;b.textContent="▶ Phir koshish";const w=document.createElement("div");w.className="m";w.textContent=err.message;b.after(w)}
      };
      if(canEdit){
        const msg=t=>{const m=c.querySelector("#msg"+k);if(m)m.textContent=t};
        const edit=async(fn,done)=>{try{msg("Ho raha hai…");await saveEps(k,fn);msg(done);setTimeout(loadYT,1200)}catch(er){msg("❌ "+er.message)}};
        c.querySelector(".sd").onclick=()=>{const v=c.querySelector(".dt").value;if(!v){msg("Tarikh chuno");return}edit(x=>{x.date=v},"✅ Tarikh badal gayi: "+v)};
        c.querySelector(".ps").onclick=()=>edit(x=>{x.auto=(x.auto===false)},e.auto===false?"✅ Phir chalu":"✅ Rok diya");
        c.querySelector(".rb").onclick=()=>{$("txt").value="@ai Bhag "+k+" dobara banao";window.scrollTo({top:0,behavior:"smooth"});st("Upar text bhar diya. Chaho to badlo, phir Bhejo dabao")};
        let armed=false;
        c.querySelector(".pn").onclick=async ev=>{
          const b=ev.target;
          if(!armed){armed=true;b.textContent="⚠️ Pakka? Phir dabao";b.style.background="#c0392b";b.style.color="#fff";setTimeout(()=>{armed=false;b.textContent="🚀 Abhi post karo";b.style.background="";b.style.color=""},6000);return}
          armed=false;b.disabled=true;
          try{
            msg("Shuru kar raha hoon…");
            await saveEps(k,x=>{x.auto=true});
            const ist=new Date(Date.now()+19800000).toISOString().slice(0,10);
            const d=(e.date&&e.date>ist)?e.date:ist;
            const r=await api("/actions/workflows/publish_day.yml/dispatches",{method:"POST",body:JSON.stringify({ref:"main",inputs:{date:d,dry_run:"false"}})});
            if(r.status!==204){const j=await r.json().catch(()=>({}));throw new Error(j.message||("error "+r.status)+" (token ko Actions: Read and write chahiye)")}
            msg("✅ Post shuru ho gaya. 3-5 minute mein YouTube par dikhega. Neeche 'Aakhri baar' mein haal dekho.");
            setTimeout(loadYT,60000);
          }catch(er){msg("❌ "+er.message);b.disabled=false}
        };
      }
      c.appendChild(fixBox(null,k));
      c.querySelector(".cp").onclick=ev=>{const d=document.createElement("div");d.className="t m";d.style.opacity=1;d.textContent=(e.caption||"")+"\n\nTags: "+(e.tags||[]).join(", ");ev.target.replaceWith(d)};
      L.appendChild(c);
    }
    // stats
    try{const t=await rawText("stats/STATS.md","main");const sc=document.createElement("div");sc.className="card";sc.innerHTML="<h3>📊 Asli views</h3><div class=t></div>";sc.querySelector(".t").textContent=t.slice(0,2000);L.appendChild(sc)}catch(e){}
    // runs
    try{
      const rr=await api("/actions/runs?per_page=60");const rj=await rr.json();
      if(!rr.ok)throw new Error(rj.message);
      const want=["Katha Chitra daily","publish-day","publish-stage","post-instagram","Video Watchdog","collect-stats"],seen={},o=[];
      for(const r of rj.workflow_runs){if(want.includes(r.name)&&!seen[r.name]){seen[r.name]=1;o.push((r.status!=="completed"?"🔄":r.conclusion==="success"?"✅":r.conclusion==="skipped"?"⏭️":"❌")+" "+r.name+" · "+fd(r.created_at))}}
      $("runs").innerText=o.length?"Aakhri baar:\n"+o.join("\n"):"Abhi koi run nahi mila";
    }catch(e){$("runs").textContent="Chalne ka haal: token ko Actions: Read-only ki ijazat chahiye"}
  }catch(e){L.textContent="Nahi aaya: "+e.message}
}
$("r4").onclick=loadYT;
function loadAll(){if(!gt())return;loadWork();loadVideos();loadYT()}
loadAll();

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
